version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: helvinho_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: helvinho_racoes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helvinho_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/helvinho_racoes
    depends_on:
      - mongodb
    volumes:
      - ./src:/app/src

volumes:
  mongo_data:
